  <title>تطور الإنجاز</title>

</head>
<body data-page="injaz">
  <header class="mast">
    <div class="mast-text">
      <p class="eyebrow">مشروع تصريف الرواكد</p>
      <h1>تطور الإنجاز</h1>
      <p class="period" id="period"></p>
    </div>
    <nav id="nav" class="nav" aria-label="أقسام التقرير"></nav>
  </header>
  <main id="app" class="wrap"></main>
  <footer class="foot">
    <p>قائمة المستهدف تُزاد في بداية كل ربع. المستهدف القطاعي هو نسبة الربع المختار من تكلفة افتتاح ذلك القطاع.</p>
    <p>تكلفة المباع = صافي الكمية × تكلفة الوحدة. الإنجاز = تكلفة المباع ÷ المستهدف. المتبقي = المستهدف − تكلفة المباع، والسالب يعني تجاوز المستهدف.</p>
  </footer>
  <script src="data.js"></script>
  <script src="report.js"></script>
</body>
